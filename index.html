<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NextPuzzle</title>
<meta name="description" content="NextPuzzle — picture puzzles made from vivid illustrations.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #161718;
  --line: #2e3133;
  --fg: #f3f0d8;
  --muted: #a9ad9f;
  --beak: #fd7401;
  --amber: #fec554;
  --sky: #558c95;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  position: relative;
  z-index: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1.0625rem/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
/* Ambient glow fixed to the viewport so it never stops at the end of the content */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(70rem 50rem at 85% -15%, color-mix(in srgb, var(--beak) 14%, transparent), transparent 70%),
    radial-gradient(80rem 60rem at -15% 115%, color-mix(in srgb, var(--sky) 11%, transparent), transparent 75%);
}
.wrap {
  max-width: 68rem; margin: 0 auto; padding-inline: clamp(1rem, 4vw, 2.5rem);
  display: flex; flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
}
main { flex: 1; display: flex; align-items: center; }
main .hero { width: 100%; }

header.top { display: flex; align-items: center; padding-block: 1.5rem; }
.brand { display: flex; align-items: center; gap: .65rem; font: 800 1.25rem/1 var(--display); letter-spacing: -.01em; color: var(--fg); text-decoration: none; }
.brand img { width: 2.5rem; height: 2.5rem; display: block; }
.brand b { color: var(--beak); font-weight: 800; }

.hero { text-align: center; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(2rem, 5vw, 4.5rem); align-items: center; padding-block: clamp(3rem, 9vw, 7rem) clamp(3rem, 8vw, 6.5rem); }
.eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin: 0 0 1rem; }
h1 {
  font: 800 clamp(2.75rem, 7vw, 5rem)/.95 var(--display);
  letter-spacing: -.035em; margin: 0 0 1.5rem; text-wrap: balance;
}
h1 .next { color: var(--beak); }
.lede { font-size: 1.2rem; color: var(--muted); max-width: 30rem; margin: 0 auto 2rem; }
.store {
  display: inline-flex; text-align: left; align-items: center; gap: .7rem;
  background: var(--fg); color: var(--bg); text-decoration: none;
  padding: .8rem 1.3rem .8rem 1.1rem; border-radius: .9rem; font-weight: 600;
  transition: transform .15s ease;
}
.store:hover { transform: translateY(-2px); }
.store:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
.store svg { width: 1.75rem; height: 1.75rem; fill: currentColor; }
.store small { display: block; font-size: .7rem; font-weight: 500; opacity: .7; line-height: 1.1; }
.store span { line-height: 1.15; font-size: 1.05rem; }

.art { justify-self: center; width: 100%; max-width: 21rem; }
.art img { display: block; width: 100%; height: auto; filter: drop-shadow(0 30px 60px rgba(0,0,0,.55)); }

footer { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.25rem; border-top: 1px solid var(--line); padding-block: 2rem 2.5rem; color: var(--muted); font-size: .9rem; }
footer a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: .25em; }
footer a:hover { color: var(--amber); text-decoration-color: currentColor; }
footer a:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 2px; }

@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .art { max-width: 15rem; order: -1; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>


<div class="wrap">

  <main id="top">
    <section class="hero">
      <div>
        <p class="eyebrow">NextPuzzle · Picture puzzle game</p>
        <h1>Put the pieces together. The <span class="next">next</span> one is waiting.</h1>
        <p class="lede">Vivid illustrations, piece by piece. Toucans, rainforests, sunsets over the river. Every piece you place brings the picture back to life.</p>
        <a class="store" href="#top" aria-label="Coming soon to the App Store">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.62c-.02-2.3 1.88-3.4 1.96-3.46-1.07-1.56-2.73-1.78-3.32-1.8-1.41-.14-2.76.83-3.47.83-.72 0-1.82-.81-2.99-.79-1.54.02-2.96.9-3.75 2.27-1.6 2.78-.41 6.89 1.15 9.14.76 1.1 1.67 2.34 2.86 2.3 1.15-.05 1.58-.74 2.96-.74 1.39 0 1.77.74 2.98.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.28 1.23-2.52 1.25-2.58-.03-.01-2.4-.92-2.42-3.66zM14.1 5.86c.63-.77 1.06-1.83.94-2.89-.91.04-2.02.61-2.67 1.37-.58.67-1.1 1.76-.96 2.8 1.02.08 2.06-.52 2.69-1.28z"/></svg>
          <span><small>Coming soon to the</small>App Store</span>
        </a>
      </div>
      <div class="art">
        <img src="NextPuzzle.png" alt="NextPuzzle app icon">
      </div>
    </section>
  </main>

  <footer>
    <span>© 2026 NextPuzzle</span>
    <a href="/privacy-policy">Privacy Policy</a>
  </footer>
</div>

</body>
</html>
